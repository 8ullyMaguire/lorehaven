name: CI

# Spec §5 requires continuous integration, and spec §4 requires integration
# tests against both databases "from the beginning" — so the PostgreSQL job is
# part of CI from the first commit rather than a promise for later.

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --workspace

  dialect-gates:
    name: Dialect gates (static checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # These are the checks that caught the PostgreSQL migration damage, and
      # each of them had a silent hole at least once -- see the handoff. They
      # are cheap, they need no database, and they run here so a regression is
      # caught on the push rather than by a failing suite twenty minutes later.
      # The checker's own rules, on statements whose correct answer is known.
      # It carried a `:: anywhere` guard that was wrong, and nothing said so.
      - name: Uncast-placeholder checker self-test
        run: python3 scripts/check-uncast-pg-placeholders.py --self-test

      # No placeholder may bind text to a column the dialect types, in either
      # direction: an uncast bind to a UUID/TIMESTAMPTZ/JSONB column, a
      # `::timestamptz` cast to a TEXT one, or a boolean literal against an
      # integer column. All three shipped broken on PostgreSQL before this.
      - name: Uncast placeholders
        run: python3 scripts/check-uncast-pg-placeholders.py crates

      # A `$n::uuid` bind is only right when the column it is compared against is
      # actually UUID. `groups.owner`, `group_members.group_id`, and
      # `taxonomy_nodes.id` are declared TEXT, and casting their binds was
      # `operator does not exist: text = uuid` -- a 500 that only PostgreSQL ever
      # showed. Six of these were live; four of the standing PG test failures
      # traced here. The types come from the migrations, so a migration that
      # changes a column is picked up without editing the check.
      - name: UUID-cast checker self-test
        run: python3 scripts/check-pg-uuid-casts.py --self-test

      - name: UUID casts against TEXT columns
        run: python3 scripts/check-pg-uuid-casts.py

      # An unaliased subquery in FROM is rejected outright by PostgreSQL
      # (`42601 subquery in FROM must have an alias`) and accepted by SQLite, so
      # the statement compiles, every SQLite test passes, and the reader gets a
      # masked 500 on the other engine. Three live occurrences: `hit_rate.rs`
      # (ten tests red on PostgreSQL) and `analytics.rs` (four `analytics_gate`
      # tests 500ing), plus `media_resilience.rs`. The self-test pins the three
      # shapes that are NOT faults — a column-list alias, `EXTRACT(EPOCH FROM
      # (...))`, and a `FROM` inside a SQL comment — each of which this checker
      # reported before the self-test existed.
      - name: Subquery-alias checker self-test
        run: python3 scripts/check-pg-subquery-alias.py --self-test

      - name: Unaliased FROM subqueries
        run: python3 scripts/check-pg-subquery-alias.py crates

      # fix-timestamptz-binds.py is disabled. It assumed the PostgreSQL
      # timestamp columns are TIMESTAMPTZ; they are TEXT, so every cast it
      # added was itself a defect. Only the self-test runs, which keeps the
      # wrong rules documented and under test.
      - name: Obsolete timestamp-cast fixer (self-test only)
        run: python3 scripts/fix-timestamptz-binds.py --self-test

      # §55.6's gate. A WASM runtime is not adopted while the sandbox that would
      # contain it does not exist — Path B's entire security model is §55.4.1's
      # domain lockdown, and shipping the path first would make every other §21
      # guarantee conditional on one unexamined function.
      #
      # This is a static check rather than only `crates/app/tests/wasm_gate.rs`
      # because that test runs *after* `cargo build`, and adding `wasmi = "0.4"`
      # to prove it fires does not compile on this toolchain (1.78 — `panic` is
      # ambiguous in wasmi 0.4.5). The build died before the test could report
      # anything, which is a gate reporting the wrong failure. Checking first says
      # what actually happened.
      - name: WASM-adoption gate self-test
        run: python3 scripts/check-wasm-gate.py --self-test

      - name: No WASM runtime adopted (§55.6)
        run: python3 scripts/check-wasm-gate.py

      - name: SQLite-pool-in-Postgres-arm checker self-test
        run: python3 scripts/check-pg-arm-uses-sqlite-pool.py --self-test

      - name: PostgreSQL arms must not use the SQLite pool
        run: python3 scripts/check-pg-arm-uses-sqlite-pool.py crates

      # `?` is SQLite syntax. A hand-written `Backend::Postgres` arm that
      # copied the SQLite arm's query literal is a syntax error at the first
      # `AND` on PostgreSQL -- a 500 -- and is green on SQLite. Eleven such
      # statements shipped in this repo before this check existed; it caught two
      # more within minutes of being written, both times a fix aimed at the
      # wrong (adjacent, near-identical) arm.
      - name: PostgreSQL backend-arm placeholder check (self-test)
        run: python3 scripts/check-pg-backend-arm-placeholders.py --self-test

      - name: PostgreSQL backend-arm placeholders must be $n
        run: python3 scripts/check-pg-backend-arm-placeholders.py

      # `ALTER TABLE ... ADD CONSTRAINT` is valid SQL and a syntax error on
      # the SQLite this project links. sqlx's libsqlite3-sys BUNDLES 3.46.0 --
      # it is not the system sqlite3 -- and ADD CONSTRAINT arrived in 3.49.0.
      # Migration 0086 used it, and the failure was a migrate()-time syntax
      # error on every fresh database, which reads as "every test in every
      # suite failed" with nothing pointing at the migration. A developer with
      # a newer sqlite3 on their PATH reproduces it working, which is the worst
      # way for a migration defect to present.
      #
      # The version is read from Cargo.lock and the vendored header, so a
      # `cargo update` that raises the bundled engine retires these rules by
      # itself rather than leaving them to rot.
      - name: SQLite migration syntax check (self-test)
        run: python3 scripts/check-sqlite-migration-syntax.py --self-test

      - name: SQLite migrations must not exceed the bundled engine's syntax
        run: python3 scripts/check-sqlite-migration-syntax.py

      # A test file whose header claims it runs on both backends while pinning
      # a sqlite:// URL is worse than one that never claimed it: the claim is
      # what stops anyone looking. m29_transparency.rs did exactly this and four
      # real PostgreSQL-only defects sat behind it -- a tag merge that never
      # moved a tag, and an explanation route that returned a redacted 500. The
      # check reads the header's CLAIM and the harness's WIRING separately,
      # strips comments before deciding whether the selector is used (a comment
      # saying "honour the backend selector" is not wiring), and exempts a
      # sentence about a migration being cross-dialect, which is a claim about
      # the schema and not about the suite.
      - name: A suite must not claim dual-backend coverage it does not have
        run: python3 scripts/find-single-backend-suites.py

  frontend:
    name: Frontend (check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type and accessibility check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  embedded-assets:
    name: Embedded assets build from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Spec §5: "a clean checkout builds". The frontend bundle is a build
      # artefact and is not committed, so this proves the placeholder path and
      # the build script ordering hold without any Node step.
      - name: Build without building the frontend first
        run: cargo build -p lorehaven-app

  postgres:
    name: PostgreSQL migrations apply
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lorehaven
          POSTGRES_PASSWORD: lorehaven
          POSTGRES_DB: lorehaven
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p lorehaven-app

      # The developer machine has no PostgreSQL, so this job is the only place
      # the PostgreSQL dialect is exercised. It fails loudly rather than
      # silently skipping, because an unrun dialect is an unverified dialect.
      - name: Apply migrations to PostgreSQL
        env:
          LOREHAVEN_DATABASE_URL: postgres://lorehaven:lorehaven@localhost:5432/lorehaven
          LOREHAVEN_STORAGE_ROOT: ${{ runner.temp }}/lorehaven
        run: |
          set -euo pipefail
          ./target/debug/lorehaven migrate
          ./target/debug/lorehaven migrate --status

      - name: Migrations are idempotent
        env:
          LOREHAVEN_DATABASE_URL: postgres://lorehaven:lorehaven@localhost:5432/lorehaven
          LOREHAVEN_STORAGE_ROOT: ${{ runner.temp }}/lorehaven
        run: |
          set -euo pipefail
          output="$(./target/debug/lorehaven migrate)"
          echo "$output"
          grep -q "already up to date" <<<"$output"

      - name: Readiness reports ready against PostgreSQL
        env:
          LOREHAVEN_DATABASE_URL: postgres://lorehaven:lorehaven@localhost:5432/lorehaven
          LOREHAVEN_STORAGE_ROOT: ${{ runner.temp }}/lorehaven
          LOREHAVEN_PORT: "8099"
        run: |
          set -euo pipefail
          ./target/debug/lorehaven serve &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/health/ready > /tmp/ready.json; then break; fi
            sleep 1
          done
          cat /tmp/ready.json
          grep -q '"status":"ready"' /tmp/ready.json
          # The readiness body names the backend it reached inside
          # `checks.database.detail`, so this is the line that proves the server
          # opened PostgreSQL rather than a SQLite file.
          grep -q 'postgres reachable at' /tmp/ready.json

      # The full golden-path journey: registration, authoring, pricing and
      # paywalls, purchase and entitlements, reviews, tips, forum topics and
      # replies, and the notifications inbox — the same paths the browser
      # smoke pass walks, asserted at the HTTP layer on every run.
      - name: Golden-path journey against PostgreSQL
        env:
          DATABASE_URL: postgres://lorehaven:lorehaven@localhost:5432/lorehaven
          PSQL: psql postgres://lorehaven:lorehaven@127.0.0.1:5432/lorehaven
        run: bash scripts/postgres-journey.sh

  browser-journeys:
    name: Browser journeys (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p lorehaven-app

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The suite spawns the built binary itself against a scratch SQLite
      # database (frontend/e2e/serve-scratch.sh) and drives the same golden
      # paths the dogfood pass walked.
      - name: Run browser journeys
        working-directory: frontend
        env:
          LOREHAVEN_BIN: ${{ github.workspace }}/target/release/lorehaven
        run: ./scripts/fe.sh e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: frontend/test-results/
          retention-days: 7
