<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Lorehaven — a welcoming home for fanfiction: read, write, import your library, and keep it offline."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Lorehaven</title>
    <script>
      // Applied before first paint so a dark-preferring reader never sees a
      // white flash. Mirrors the resolution in src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('lorehaven.theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = !stored || stored === 'system' ? (prefersDark ? 'after-hours' : 'reading-room') : stored;
          document.documentElement.dataset.theme = resolved;
        } catch (error) {
          document.documentElement.dataset.theme = 'reading-room';
        }
      })();

      // Reading typography, applied before first paint for the same reason:
      // a reader must not see the text resize under them. Mirrors
      // `applyTypography` in src/lib/reading.ts, which is what keeps it in
      // step afterwards. The stored object is the one the server last
      // reported, so the fields are the server's names.
      (function () {
        try {
          var raw = localStorage.getItem('lorehaven.typography');
          if (!raw) return;
          var prefs = JSON.parse(raw);
          var style = document.documentElement.style;
          if (typeof prefs.font_scale === 'number') {
            style.setProperty('--reader-font-scale', String(prefs.font_scale));
          }
          if (typeof prefs.line_height === 'number') {
            style.setProperty('--reader-line-height', String(prefs.line_height));
          }
          if (typeof prefs.measure === 'number') {
            style.setProperty('--reader-measure', prefs.measure + 'ch');
          }
          if (prefs.reader_theme) {
            document.documentElement.dataset.readerTheme = prefs.reader_theme;
          }
          if (prefs.distraction_free) {
            document.documentElement.dataset.distractionFree = 'true';
          }
        } catch (error) {
          // A corrupt preference is not worth blocking the page for.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
