<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Lorehaven — a welcoming home for fanfiction: read, write, import your library, and keep it offline."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111014" />
    <meta name="apple-mobile-web-app-title" content="Lorehaven" />
    <title>Lorehaven</title>
    <!--
      Appearance before the first paint lives in a file, not in a block here:
      the server's Content-Security-Policy is `script-src 'self'`, so an inline
      script is refused by the browser without an error the page can see.
      `src/lib/prepaint.test.ts` fails if an inline script returns.
    -->
    <script src="/prepaint.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
