[package]
name = "lorehaven-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Database access, migrations and repositories for Lorehaven"
build = "build.rs"

[lib]
name = "lorehaven_db"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
hex.workspace = true
# For the link challenge's nonce only (spec §23.2). Already in the tree
# transitively via `uuid` and `sqlx`, so this costs no new dependency tree, and
# the house pattern in crates/app/src/secrets.rs uses the same calls.
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

lorehaven-domain = { path = "../domain" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
