[package]
name = "darkhold-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Database access, migrations and repositories for Darkhold"
build = "build.rs"

[lib]
name = "darkhold_db"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
hex.workspace = true
# For the link challenge's nonce only (spec §23.2). Already in the tree
# transitively via `uuid` and `sqlx`, so this costs no new dependency tree, and
# the house pattern in crates/app/src/secrets.rs uses the same calls.
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

darkhold-domain = { path = "../domain" }
# The works ladder stores the arena's ratings, and the rating maths lives in the
# taste engine (T-M16-01). Depending on it is the right direction — the engine is a
# pure crate that reads no database — and the alternative is worse: a second copy of
# Glicko-2 in the store, which is two things to keep in step and the one that diverges
# is the one nobody measures.
darkhold-taste = { path = "../taste" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The scoped-database harness, for a test that needs the schema *between* two
# migrations (crates/db/tests/canonical_entities.rs).
test-support = { path = "../test-support" }

[lints]
workspace = true
