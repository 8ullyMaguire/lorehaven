[package]
name = "lorehaven-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lorehaven server binary: CLI, composition root, HTTP surface"
build = "build.rs"

[[bin]]
name = "lorehaven"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
mime_guess.workspace = true
rand.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
url = "2"
tracing-subscriber.workspace = true
uuid.workspace = true

lorehaven-db = { path = "../db" }
lorehaven-domain = { path = "../domain" }
# `cloudflare-impersonation` is a feature of the scraper crate rather than a
# default of it, so that a library consumer is not made to carry a second HTTP/TLS
# stack. The binary this workspace ships is the instance an operator runs, and it
# is the one that has to be able to read fanfiction.net — so the feature is turned
# on here, once, and the crate stays lean for everybody else.
lorehaven-scrapers = { path = "../scrapers", features = ["cloudflare-impersonation"] }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
test-support = { path = "../test-support" }

[lints]
workspace = true
