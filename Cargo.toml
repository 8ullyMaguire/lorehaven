[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/db",
    "crates/app",
    "crates/scrapers",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
repository = "https://example.invalid/lorehaven"
description = "Lorehaven — a self-hosted fanfiction archive and community platform"

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "query",
    "form",
    "tokio",
    "matched-path",
] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
hex = "0.4"
mime_guess = "2"
rand = "0.8"
regex-lite = "0.1"
# The importer's HTTP client. `cookies` is needed because several sources gate
# an adult-confirmation or a login behind a session cookie; `rustls-tls` keeps
# the TLS stack in-process so a deployment needs no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "cookies",
    "charset",
    "http2",
] }
rust-embed = { version = "8", features = ["include-exclude", "interpolate-folder-path"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "postgres",
    "uuid",
    "time",
    "macros",
] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "net", "time"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = [
    "trace",
    "request-id",
    "limit",
    "set-header",
    "timeout",
    "cors",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
